# pre-commit — odoo-union (Mueve-TEC/odoo-union, branch 19.0)
#
# Replica la stack "adhoc" de ingadhoc usada en odoo-argentina (ver
# submodules/odoo-argentina/.pre-commit-config.yaml). A diferencia de aquél,
# este repo no tiene subtrees upstream: TODO el árbol es código propio de
# Mueve, así que la config aplica uniforme a los 4 módulos:
#   - union_affiliation/
#   - union_benefit_request/
#   - union_contribution/
#   - union_school_position/
#   - tests/ de cada módulo y archivos de raíz (TESTING.md, pyproject.toml)
#
# Versiones fijadas en paridad con la stack adhoc para minimizar diferencias
# entre repos: ruff v0.6.8, pylint-odoo v9.1.3, odoo-pre-commit-hooks v0.0.35,
# pre-commit-hooks v5.0.0, rstcheck v6.2.1. La stack OCA pesada (whool,
# maintainer-tools, prettier, eslint) NO se replica a propósito.
#
# Instalación (una vez desde la raíz de odoo-union):  pre-commit install
# Uso manual:        pre-commit run --all-files

exclude: |
  (?x)
  # We don't want to mess with tool-generated files
  .svg$|/tests/([^/]+/)?cassettes/|^.copier-answers.yml$|^.github/|^eslint.config.cjs|^prettier.config.cjs|
  # Library files can have extraneous formatting (even minimized)
  /static/(src/)?lib/|
  # Ignore build and dist directories in addons
  /build/|/dist/|
  # Ignore test files in addons
  /tests/samples/.*|
  # You don't usually want a bot to modify your legal texts
  (LICENSE.*|COPYING.*)

default_language_version:
    python: python3

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
        args: ['--assume-in-merge']
        exclude: '\.(rst|md)$'
      - id: check-symlinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        # exclude autogenerated files
        exclude: \.pot?$

  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.0.35
    hooks:
      - id: oca-checks-odoo-module
        args:
          - --disable=xml-dangerous-qweb-replace-low-priority,xml-view-dangerous-replace-low-priority,xml-oe-structure-missing-id
      - id: oca-checks-po
        args:
          # Un solo flag --disable: un segundo flag pisa al primero
          # (semántica last-wins de argparse).
          # - po-pretty-format: formateo cosmético.
          # El disable temporal de po-duplicate-message-definition se quitó
          # tras regenerar los es_AR.po desde las fuentes 19.0 (Phase 4.1).
          - --disable=po-pretty-format

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/OCA/pylint-odoo
    rev: v9.1.3
    hooks:
      - id: pylint_odoo
        args:
          # E0401 (import-error): deps no instalados en el entorno de lint.
          - --disable=E0401
          # C0301 (line-too-long): alineado con ruff line-length=120 (ver
          # pyproject.toml).
          - --max-line-length=120
          # Deshabilitados por convención Odoo/paridad con la stack adhoc
          # (los pyprojects de los subtrees ingadhoc usan disable=all +
          # allowlist; aquí se lista explícito para mantener señal útil):
          - >-
            --disable=
            C0103,C0114,C0115,C0116,
            C0209,C0415,
            R0801,R0903,R0904,R1702,R0911,R0912,R0913,R0914,R1705,R1710,R1719,R1725,
            W0104,W0212,W0511,W0621,W1404
          # C0103  invalid-name            — setUpClass/uid/ODOO convenciones
          # C0114/15/16 missing-docstring — volumen típico en módulos Odoo
          # C0209  consider-using-f-string — %s legacy tolerado (UP031 idem ruff)
          # C0415  import-outside-toplevel — datetime dentro de computes
          # R0801  duplicate-code         — bloques uid-validación repetidos entre
          #                                   los 4 módulos hermanos; refactor a
          #                                   mixin pendiente
          # R0903/R0904 too-few/too-many-public-methods — modelos chicos y
          #                                   suites de tests grandes
          # R0911  too-many-return-statements — _get_current_period
          # R0913  too-many-arguments    — override _message_get_suggested_
          #                                   recipients mantiene firma Odoo 19
          # R0914  too-many-locals       — workplace_delete_wizard.default_get
          # R1702/R0912 nested-blocks / many-branches — create() con rama de
          #                                   import; refactor pendiente
          # R1705/R1719 no-else-return / simplifiable-if — estilo
          # R1710  inconsistent-return-statements — meet_reqs/_get_current_period
          # R1725  super-with-arguments   — paridad con UP008 ignorado en ruff
          # W0104  pointless-statement    — dict literal como cuerpo de __manifest__.py
          # W0212  protected-access       — tests invocan _compute_*/_name_search
          # W0511  fixme                  — TODOs conocidos y documentados
          # W0621  redefined-outer-name   — override base_import.do(self, fields, …)
          #                                   mantiene firma upstream
          # W1404  implicit-str-concat    — patrón estándar para strings largos
          #                                   de traducción multi-línea

  - repo: https://github.com/rstcheck/rstcheck
    rev: v6.2.1
    hooks:
      - id: rstcheck
